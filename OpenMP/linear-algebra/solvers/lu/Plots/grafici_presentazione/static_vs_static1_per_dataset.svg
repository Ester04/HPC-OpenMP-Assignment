<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">static versus static,1 wall-time change by dataset</title>
  <desc id="desc">For each matrix size, the percentage difference is (static,1 median divided by static median minus one) times 100. Negative means static,1 is faster. Five perf runs per setting.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #F7F8FC; }
      .muted { fill: #BEC4D9; }
      .cyan { fill: #55D6E8; }
      .mint { fill: #9DE3C3; }
      .grid { stroke: #3A4164; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="700" rx="24" fill="#151832"/>
  <text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700">static vs. static,1 across matrix sizes</text>
  <text x="600" y="91" text-anchor="middle" font-size="18" class="muted">Median wall-time change: (static,1 / static − 1) × 100% · Negative means static,1 is faster</text>

  <g class="grid">
    <line x1="150" y1="160" x2="1050" y2="160"/>
    <line x1="150" y1="250" x2="1050" y2="250"/>
    <line x1="150" y1="340" x2="1050" y2="340"/>
    <line x1="150" y1="430" x2="1050" y2="430"/>
    <line x1="150" y1="520" x2="1050" y2="520"/>
  </g>
  <g font-size="17" class="muted" text-anchor="end">
    <text x="132" y="166">+6%</text>
    <text x="132" y="256">+3%</text>
    <text x="132" y="346">0%</text>
    <text x="132" y="436">−3%</text>
    <text x="132" y="526">−6%</text>
  </g>
  <line x1="150" y1="160" x2="150" y2="520" stroke="#BEC4D9" stroke-width="1.5"/>
  <line x1="150" y1="520" x2="1050" y2="520" stroke="#BEC4D9" stroke-width="1.5"/>

  <g font-size="17" class="muted" text-anchor="middle">
    <text x="240" y="555">32</text>
    <text x="420" y="555">128</text>
    <text x="600" y="555">1024</text>
    <text x="780" y="555">2000</text>
    <text x="960" y="555">4000</text>
  </g>
  <text x="600" y="596" text-anchor="middle" font-size="19" class="muted">Matrix size N</text>

  <path d="M240 340 L420 340 L600 223.9 L780 362.2 L960 342.4" fill="none" stroke="#55D6E8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M240 470.5 L420 340 L600 173.8 L780 336.4 L960 344.8" fill="none" stroke="#9DE3C3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#55D6E8">
    <circle cx="240" cy="340" r="7"/>
    <circle cx="420" cy="340" r="7"/>
    <circle cx="600" cy="223.9" r="7"/>
    <circle cx="780" cy="362.2" r="7"/>
    <circle cx="960" cy="342.4" r="7"/>
  </g>
  <g fill="#9DE3C3">
    <circle cx="240" cy="470.5" r="7"/>
    <circle cx="420" cy="340" r="7"/>
    <circle cx="600" cy="173.8" r="7"/>
    <circle cx="780" cy="336.4" r="7"/>
    <circle cx="960" cy="344.8" r="7"/>
  </g>

  <line x1="400" y1="640" x2="445" y2="640" stroke="#55D6E8" stroke-width="5"/>
  <circle cx="422" cy="640" r="6" fill="#55D6E8"/>
  <text x="455" y="646" font-size="17" class="cyan">4 threads</text>
  <line x1="610" y1="640" x2="655" y2="640" stroke="#9DE3C3" stroke-width="5"/>
  <circle cx="632" cy="640" r="6" fill="#9DE3C3"/>
  <text x="665" y="646" font-size="17" class="mint">8 threads</text>
</svg>
