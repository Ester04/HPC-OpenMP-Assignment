<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="#F7F8FC" role="img" aria-labelledby="title desc">
<title id="title">Cache misses: static vs. static,1</title><desc id="desc">Cache miss medians by dataset, normalized per dataset to static equals 100 percent; absolute counts are labeled.</desc>
<style>text { font-family: Arial, Helvetica, sans-serif; } .muted { fill: #BEC4D9; }</style>
<rect width="1200" height="720" rx="24" fill="#151832"/>
<text x="600" y="46" text-anchor="middle" font-size="29" font-weight="700">Cache misses: static vs. static,1</text>
<text x="600" y="79" text-anchor="middle" font-size="17" class="muted">Median perf counts · 4 threads requested · 3 runs · static / static,1</text>
<rect x="395" y="98" width="18" height="18" rx="4" fill="#55D6E8"/><text x="423" y="113" font-size="17">static</text><rect x="590" y="98" width="18" height="18" rx="4" fill="#9DE3C3"/><text x="618" y="113" font-size="17">static,1</text>
<line x1="190" y1="130" x2="190" y2="515" stroke="#3A4164" stroke-width="1.5"/><text x="190" y="540" text-anchor="middle" font-size="15" class="muted">0%</text><line x1="350" y1="130" x2="350" y2="515" stroke="#3A4164" stroke-width="1.5"/><text x="350" y="540" text-anchor="middle" font-size="15" class="muted">50%</text><line x1="510" y1="130" x2="510" y2="515" stroke="#3A4164" stroke-width="1.5"/><text x="510" y="540" text-anchor="middle" font-size="15" class="muted">100%</text><line x1="670" y1="130" x2="670" y2="515" stroke="#3A4164" stroke-width="1.5"/><text x="670" y="540" text-anchor="middle" font-size="15" class="muted">150%</text><line x1="830" y1="130" x2="830" y2="515" stroke="#3A4164" stroke-width="1.5"/><text x="830" y="540" text-anchor="middle" font-size="15" class="muted">200%</text><line x1="990" y1="130" x2="990" y2="515" stroke="#3A4164" stroke-width="1.5"/><text x="990" y="540" text-anchor="middle" font-size="15" class="muted">250%</text><text x="175" y="166" text-anchor="end" font-size="18" class="muted">N=32</text><rect x="190" y="140" width="320.00" height="22" rx="5" fill="#55D6E8"/><rect x="190" y="167" width="354.01" height="22" rx="5" fill="#9DE3C3"/><text x="1095" y="157" text-anchor="end" font-size="15" fill="#55D6E8">22,739 misses</text><text x="1095" y="184" text-anchor="end" font-size="15" fill="#9DE3C3">25,156 misses</text><text x="175" y="240" text-anchor="end" font-size="18" class="muted">N=128</text><rect x="190" y="214" width="320.00" height="22" rx="5" fill="#55D6E8"/><rect x="190" y="241" width="719.39" height="22" rx="5" fill="#9DE3C3"/><text x="1095" y="231" text-anchor="end" font-size="15" fill="#55D6E8">78,432 misses</text><text x="1095" y="258" text-anchor="end" font-size="15" fill="#9DE3C3">176,322 misses</text><text x="175" y="314" text-anchor="end" font-size="18" class="muted">N=1024</text><rect x="190" y="288" width="320.00" height="22" rx="5" fill="#55D6E8"/><rect x="190" y="315" width="373.19" height="22" rx="5" fill="#9DE3C3"/><text x="1095" y="305" text-anchor="end" font-size="15" fill="#55D6E8">49,567,898 misses</text><text x="1095" y="332" text-anchor="end" font-size="15" fill="#9DE3C3">57,806,577 misses</text><text x="175" y="388" text-anchor="end" font-size="18" class="muted">N=2000</text><rect x="190" y="362" width="320.00" height="22" rx="5" fill="#55D6E8"/><rect x="190" y="389" width="340.59" height="22" rx="5" fill="#9DE3C3"/><text x="1095" y="379" text-anchor="end" font-size="15" fill="#55D6E8">347,582,571 misses</text><text x="1095" y="406" text-anchor="end" font-size="15" fill="#9DE3C3">369,945,784 misses</text><text x="175" y="462" text-anchor="end" font-size="18" class="muted">N=4000</text><rect x="190" y="436" width="320.00" height="22" rx="5" fill="#55D6E8"/><rect x="190" y="463" width="324.53" height="22" rx="5" fill="#9DE3C3"/><text x="1095" y="453" text-anchor="end" font-size="15" fill="#55D6E8">4,634,555,589 misses</text><text x="1095" y="480" text-anchor="end" font-size="15" fill="#9DE3C3">4,700,200,546 misses</text><text x="590" y="576" text-anchor="middle" font-size="16" class="muted">Median cache misses relative to static for the same N (static = 100%)</text>
<rect x="65" y="615" width="1070" height="82" rx="14" fill="#1C2040"/>
<text x="90" y="647" font-size="16" class="muted">Values on the right are absolute median counts.</text>
<text x="90" y="675" font-size="16" class="muted">Counts cover the whole process and runtime; hardware event semantics depend on the CPU.</text>
</svg>
